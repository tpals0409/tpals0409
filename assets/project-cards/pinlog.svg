<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
  <title id="title">PinLog 프로젝트 카드</title>
  <desc id="desc">장소 기록 서비스, 6인 팀 인프라 DevOps 리드</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#10241f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="598" height="318" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="0" y="0" width="600" height="6" rx="3" fill="url(#accent)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
    <text x="32" y="42" fill="#34d399" font-size="13" font-weight="700" letter-spacing="1.2">PLATFORM · TEAM OF 6</text>
    <text x="32" y="80" fill="#f0f6fc" font-size="29" font-weight="750">PinLog</text>
    <text x="32" y="111" fill="#c9d1d9" font-size="16">장소의 맥락을 기록하고 자연어로 다시 찾는</text>
    <text x="32" y="135" fill="#c9d1d9" font-size="16">장소 기록·발견 서비스</text>
    <rect x="32" y="158" width="82" height="28" rx="14" fill="#052e2b" stroke="#10b981"/>
    <text x="73" y="177" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">담당 역할</text>
    <text x="32" y="214" fill="#f0f6fc" font-size="16" font-weight="650">인프라·DevOps 리드</text>
    <text x="32" y="239" fill="#8b949e" font-size="15">단일 서버 k3s 전환, CI/CD·관측·운영 체계 구축</text>
    <line x1="32" y1="260" x2="568" y2="260" stroke="#30363d"/>
    <text x="32" y="289" fill="#22d3ee" font-size="13" font-weight="650">Kubernetes · Argo CD · Prometheus · Loki · Python</text>
    <text x="568" y="289" fill="#8b949e" font-size="13" text-anchor="end">저장소 보기 →</text>
  </g>
</svg>
