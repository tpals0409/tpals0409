<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc">
  <title id="title">Todaktodak 프로젝트 카드</title>
  <desc id="desc">감정 위로 AI 서비스, 6인 팀 AI ML 백엔드 기여</desc>
  <defs>
    <filter id="raised" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="-6" dy="-6" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.92"/><feDropShadow dx="7" dy="7" stdDeviation="7" flood-color="#aeb7c4" flood-opacity="0.58"/></filter>
    <filter id="raisedSmall" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-3" dy="-3" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.9"/><feDropShadow dx="4" dy="4" stdDeviation="4" flood-color="#b6bec9" flood-opacity="0.52"/></filter>
  </defs>
  <rect width="600" height="330" rx="28" fill="#e8ecf1"/>
  <rect x="19" y="19" width="562" height="292" rx="24" fill="#e8ecf1" filter="url(#raised)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
    <rect x="46" y="43" width="52" height="52" rx="16" fill="#e8ecf1" filter="url(#raisedSmall)"/>
    <circle cx="72" cy="69" r="17" fill="#e7dce0"/><text x="72" y="76" fill="#8d6f79" font-size="21" font-weight="750" text-anchor="middle">T</text>
    <text x="118" y="66" fill="#253246" font-size="25" font-weight="750">Todaktodak</text>
    <text x="118" y="89" fill="#6b7788" font-size="13">감정 위로 AI 서비스</text>
    <rect x="431" y="51" width="119" height="34" rx="17" fill="#e8ecf1" filter="url(#raisedSmall)"/>
    <text x="490.5" y="73" fill="#8d6f79" font-size="12.5" font-weight="700" text-anchor="middle">6인 팀 프로젝트</text>
    <text x="47" y="127" fill="#4b586b" font-size="15.5">일기를 바탕으로 4컷 만화와 음악, 감정 분석을</text>
    <text x="47" y="151" fill="#4b586b" font-size="15.5">생성해 사용자의 하루를 위로합니다.</text>
    <rect x="46" y="172" width="508" height="90" rx="18" fill="#e8ecf1" filter="url(#raisedSmall)"/>
    <rect x="62" y="187" width="4" height="58" rx="2" fill="#8d6f79"/>
    <text x="79" y="197" fill="#8d6f79" font-size="12" font-weight="700">담당 역할</text>
    <text x="79" y="224" fill="#253246" font-size="16" font-weight="700">AI/ML·백엔드 기여</text>
    <text x="79" y="247" fill="#6b7788" font-size="13.5">GPT 감정 분석, LoRA 이미지 생성, AI↔백엔드 연동</text>
    <text x="47" y="294" fill="#647184" font-size="12.5" font-weight="650">GPT API · Stable Diffusion LoRA · Python · Amazon S3</text>
    <circle cx="548" cy="289" r="16" fill="#e7dce0"/><text x="548" y="295" fill="#8d6f79" font-size="17" font-weight="750" text-anchor="middle">↗</text>
  </g>
</svg>
