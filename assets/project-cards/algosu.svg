    <text x="32" y="111" fill="#c9d1d9" font-size="16">코드 제출부터 GitHub 기록·AI 리뷰까지 연결한</text>
    <text x="32" y="135" fill="#c9d1d9" font-size="16">알고리즘 스터디 관리 플랫폼</text>
