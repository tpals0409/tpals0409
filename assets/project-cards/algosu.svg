      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#111b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="598" height="318" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="0" y="0" width="600" height="6" rx="3" fill="url(#accent)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
    <text x="32" y="42" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1.2">AI SERVICE · SOLO</text>
