<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
  <title id="title">Graph RAG Second Brain 프로젝트 카드</title>
  <desc id="desc">근거와 관계를 중심으로 설계한 개인 지식 운영 시스템</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#1e1933"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="598" height="318" rx="18" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="0" y="0" width="600" height="6" rx="3" fill="url(#accent)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif">
    <text x="32" y="42" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="1.2">KNOWLEDGE SYSTEM · PERSONAL</text>
    <text x="32" y="80" fill="#f0f6fc" font-size="27" font-weight="750">Graph RAG Second Brain</text>
    <text x="32" y="111" fill="#c9d1d9" font-size="16">프로젝트 경험과 의사결정을 근거와 관계로 축적하는</text>
    <text x="32" y="135" fill="#c9d1d9" font-size="16">개인 지식 운영 시스템</text>
    <rect x="32" y="158" width="82" height="28" rx="14" fill="#451a03" stroke="#f59e0b"/>
    <text x="73" y="177" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">담당 역할</text>
    <text x="32" y="214" fill="#f0f6fc" font-size="16" font-weight="650">지식 구조·검색·검증 워크플로우 설계 및 구현</text>
    <text x="32" y="239" fill="#8b949e" font-size="15">5계층 구조와 근거 추적·Human-in-the-Loop 운영</text>
    <line x1="32" y1="260" x2="568" y2="260" stroke="#30363d"/>
    <text x="32" y="289" fill="#f472b6" font-size="13" font-weight="650">Obsidian · JSONL Graph · SQLite · fastembed · Python</text>
    <text x="568" y="289" fill="#8b949e" font-size="13" text-anchor="end">포트폴리오 보기 →</text>
