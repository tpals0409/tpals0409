<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc">
  <title id="title">FINCH</title>
  <desc id="desc">F FINCH 포트폴리오 기반 AI 모의투자 개인 ver2 개발 실제 시장 데이터로 모의투자를 경험하고 내 포트폴리오를 근거로 AI와 대화합니다. 개발 방향과 설계 팀 프로젝트에서 개인 ver2로 확장 원장을 기준으로 계산하고, AI는 결과를 설명 React · Kotlin · Spring Boot · FastAPI · Capacitor ↗</desc>
