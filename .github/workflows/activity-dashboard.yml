name: Generate activity dashboard

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/activity-dashboard.yml"
      - "scripts/generate_activity_dashboard.py"

permissions:
  contents: write

concurrency:
  group: activity-dashboard
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7.0.1

      - name: Generate light and dark activity dashboards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_activity_dashboard.py \
            --username "${{ github.repository_owner }}" \
            --output-dir dist

      - name: Publish dashboards to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
